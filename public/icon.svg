<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft tactile drop shadow -->
    <filter id="eyeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle: Electric Canary Yellow -->
  <rect width="512" height="512" rx="112" fill="#F7FA40" />

  <!-- Bold Letter D in Deep Black -->
  <path d="M108 92 H 244 C 362 92, 436 160, 436 256 C 436 352, 362 420, 244 420 H 108 Z" fill="#141518" />

  <!-- Inner Counter of the D in Yellow -->
  <path d="M188 168 H 240 C 304 168, 348 204, 348 256 C 348 308, 304 344, 240 344 H 188 Z" fill="#F7FA40" />

  <!-- Iconic Cartoon Eyes nestled into the D -->
  <g filter="url(#eyeShadow)">
    <!-- Left Eye Base & Pupil -->
    <ellipse cx="222" cy="256" rx="42" ry="54" fill="#FFFFFF" stroke="#141518" stroke-width="12" />
    <ellipse cx="236" cy="248" rx="20" ry="28" fill="#141518" />
    <circle cx="244" cy="238" r="7" fill="#FFFFFF" />

    <!-- Right Eye Base & Pupil -->
    <ellipse cx="298" cy="256" rx="42" ry="54" fill="#FFFFFF" stroke="#141518" stroke-width="12" />
    <ellipse cx="312" cy="248" rx="20" ry="28" fill="#141518" />
    <circle cx="320" cy="238" r="7" fill="#FFFFFF" />
  </g>
</svg>
